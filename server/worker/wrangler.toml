name = "netparty"
main = "index.js"
compatibility_date = "2025-10-01"
account_id = "a40d9c78c5c15c7b985ca6e259159056"
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "PartyHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyHub"]

# the extension zip is bundled into the Worker (built by `npm run build:zip`) and
# served only through a live party's invite page (see index.js)
[[rules]]
type = "Data"
globs = ["**/*.zip"]
fallthrough = false
