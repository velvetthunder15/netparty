<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetParty invite QR code</title>
  <!-- 2.3: the chat panel's QR code. It's drawn here, in the extension's own page, because the panel lives inside the
       streaming site's page and the site could read a canvas there (the link carries the party's key). -->
  <style>
    @font-face { font-family: "NetParty Inter"; src: url("fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; }
    :root { color-scheme: light dark; --bg: #f6f5fb; --fg: #17171c; --dim: #5e5e6b; --card: #ffffff; --line: #e3e1ee; --accent: #6c4cf5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f13; --fg: #f3f3f6; --dim: #a3a3ad; --card: #1b1b22; --line: #2e2e38; --accent: #a48bff; } }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.45 "NetParty Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(320px, calc(100vw - 32px)); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .qr { padding: 14px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
    canvas { display: block; width: 232px; height: 232px; image-rendering: pixelated; }
    p { margin: 0; color: var(--dim); font-size: 13px; }
    .note { font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Scan to join the party</h1>
    <div class="qr" id="box" hidden><canvas id="qr" role="img" aria-label="QR code of your invite link"></canvas></div>
    <p id="msg">Scan it with your phone's camera, then send the link to friends from there.</p>
    <p class="note">🔒 The link unlocks your encrypted chat. Send it only to friends.</p>
  </main>
  <script src="qr.js"></script>
  <script src="qr-page.js"></script>
</body>
</html>
