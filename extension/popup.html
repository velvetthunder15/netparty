<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <div>
        <h1>NetParty</h1>
        <p class="sub">Watch together, in sync</p>
      </div>
    </header>

    <!-- not on Netflix / JioHotstar -->
    <section id="vOff" class="hidden">
      <p class="lead">Open Netflix or JioHotstar to start or join a party.</p>
      <div class="two">
        <button class="ghost" data-open="https://www.netflix.com/browse">Open Netflix</button>
        <button class="ghost" data-open="https://www.hotstar.com/in/home">Open JioHotstar</button>
      </div>
    </section>

    <!-- on the site, not in a party -->
    <section id="vIdle" class="hidden">
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="24" placeholder="What friends will see" />

      <div id="startBox">
        <button id="create" class="primary">Start a party</button>
        <p class="hint" id="startHint"></p>
      </div>

      <div class="divider"><span>or join a friend</span></div>
      <div class="joinrow">
        <input id="code" type="text" placeholder="Paste invite link or code" />
        <button id="join" class="ghost small">Join</button>
      </div>
    </section>

    <!-- in a party -->
    <section id="vParty" class="hidden">
      <div class="card">
        <div class="label">Party code</div>
        <div class="code" id="partyCode"></div>
        <div class="who" id="who"></div>
      </div>
      <button id="copy" class="primary">Copy invite link</button>
      <p class="hint">Friends open the link, install NetParty if they haven't, and land in sync.</p>
      <button id="chat" class="ghost">Open chat &amp; voice</button>
      <label class="toggle hidden" id="hostRow">
        <input type="checkbox" id="hostOnly" />
        <span>Only I can play, pause and skip</span>
      </label>
      <button id="leave" class="text danger">Leave party</button>
    </section>

    <div id="error" class="err"></div>

    <details>
      <summary>Advanced</summary>
      <label for="server">Party server</label>
      <input id="server" type="text" placeholder="wss://…" />
      <button id="save" class="ghost small">Save</button>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
